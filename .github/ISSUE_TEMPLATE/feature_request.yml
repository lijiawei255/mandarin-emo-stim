name: 功能建议 / Feature request
description: 新模态、新刺激策略、新平台支持等
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题 / Problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 / Proposal
      description: 若涉及方法学（新特征、新权重、新映射），请附文献依据；本项目要求每处方法学都标注证据等级（见 docs/research_notes.md）。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives
