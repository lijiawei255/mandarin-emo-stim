name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install ruff==0.6.9
      - run: ruff check .

  test:
    name: pytest (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: System libraries (Linux, for Qt offscreen + libsndfile)
        if: runner.os == 'Linux'
        run: |
          # 跑者预装的第三方 apt 源（如 Google Chrome）偶发 Hash Sum mismatch，与本项目无关，先移除再更新
          sudo grep -l -E "dl.google.com|packages.microsoft.com" /etc/apt/sources.list.d/* 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update || true   # 第三方源偶发校验失败不应阻断；Ubuntu 官方源索引仍可用
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libsndfile1 libportaudio2 ffmpeg
      - name: PyTorch (CPU wheels)
        run: pip install torch==2.3.1 torchaudio==2.3.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Dependencies
        run: pip install -r requirements.txt
      - name: Unit tests (no GPU / no models)
        run: python -m pytest -q
      - name: GUI smoke + layout geometry (offscreen)
        run: python -m pytest -q -m slow
